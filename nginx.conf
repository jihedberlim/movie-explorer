server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Angular routes like /movie/157336 are not real files, so nginx answers them with index.html
  # and the Angular router shows the right page (otherwise a reload would give a 404)
  location / {
    try_files $uri $uri/ /index.html;
  }

  # The build puts a hash in these file names, so a new version always has a new name
  location ~* \.(js|css)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}
