<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Movie Explorer</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap"
    />
    <script>
      // Runs before Angular loads, so a dark mode user doesn't see a white flash.
      // Same rule as ThemeService: saved choice first, then the OS setting.
      try {
        const saved = localStorage.getItem('movie-explorer.theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (saved === 'dark' || (saved === null && prefersDark)) {
          document.documentElement.classList.add('dark');
        }
      } catch {}
    </script>
  </head>
  <body class="bg-gray-50 text-gray-900 antialiased dark:bg-gray-950 dark:text-gray-100">
    <app-root></app-root>
  </body>
</html>
