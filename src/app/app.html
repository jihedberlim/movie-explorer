<header class="border-b border-gray-200 bg-white dark:border-gray-800 dark:bg-gray-900">
  <nav class="mx-auto flex max-w-6xl flex-wrap items-center gap-x-4 gap-y-2 px-4 py-3 sm:gap-x-6">
    <a routerLink="/" class="text-lg font-bold">Movie Explorer</a>
    <a routerLink="/search">Search</a>
    <a routerLink="/discover">Discover</a>
    <a routerLink="/watchlist" class="flex items-center gap-1">
      Watchlist
      @if (watchlist.count() > 0) {
        <span class="rounded-full bg-blue-600 px-2 text-xs font-bold text-white">
          {{ watchlist.count() }}
        </span>
      }
    </a>

    <button
      type="button"
      (click)="themeService.toggle()"
      [attr.aria-label]="
        themeService.theme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'
      "
      class="ml-auto rounded-full p-2 text-lg hover:bg-gray-100 dark:hover:bg-gray-800"
    >
      {{ themeService.theme() === 'dark' ? '☀️' : '🌙' }}
    </button>
  </nav>
</header>

<main class="mx-auto max-w-6xl px-4 py-6">
  <router-outlet />
</main>

<app-toast />
