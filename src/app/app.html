<header class="border-b border-gray-200 bg-white dark:border-gray-800 dark:bg-gray-900">
  <nav class="mx-auto flex max-w-6xl items-center gap-6 px-4 py-3">
    <a routerLink="/" class="text-lg font-bold">Movie Explorer</a>
    <a routerLink="/search">Search</a>
    <a routerLink="/discover">Discover</a>
    <a routerLink="/watchlist" class="flex items-center gap-1">
      Watchlist
      @if (watchlist.count() > 0) {
        <span class="rounded-full bg-blue-600 px-2 text-xs font-bold text-white">
          {{ watchlist.count() }}
        </span>
      }
    </a>
  </nav>
</header>

<main class="mx-auto max-w-6xl px-4 py-6">
  <router-outlet />
</main>
