<header
  class="sticky top-0 z-40 border-b border-gray-200/70 bg-white/80 backdrop-blur-md dark:border-gray-800/70 dark:bg-gray-950/80"
>
  <div class="mx-auto flex max-w-6xl flex-wrap items-center gap-x-6 gap-y-2 px-4 py-3">
    <a routerLink="/" class="flex items-center gap-2">
      <svg viewBox="0 0 32 32" class="size-8 shrink-0" aria-hidden="true">
        <rect width="32" height="32" rx="8" class="fill-brand-600" />
        <path d="M12 9.5v13l11-6.5z" fill="#fff" />
      </svg>
      <span class="font-display text-xl font-extrabold tracking-tight">
        Movie <span class="text-brand-600 dark:text-brand-400">Explorer</span>
      </span>
    </a>

    <nav class="order-last -mx-1 flex w-full gap-1 overflow-x-auto sm:order-0 sm:mx-0 sm:w-auto">
      <a
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="nav-link"
      >
        {{ i18n.t('nav.home') }}
      </a>
      <a routerLink="/search" routerLinkActive="active" class="nav-link">{{
        i18n.t('nav.search')
      }}</a>
      <a routerLink="/discover" routerLinkActive="active" class="nav-link">{{
        i18n.t('nav.discover')
      }}</a>
      <a
        routerLink="/watchlist"
        routerLinkActive="active"
        class="nav-link flex items-center gap-1.5"
      >
        {{ i18n.t('nav.watchlist') }}
        @if (watchlist.count() > 0) {
          <span class="rounded-full bg-brand-600 px-2 text-xs font-bold text-white">
            {{ watchlist.count() }}
          </span>
        }
      </a>
    </nav>

    <app-language-selector class="ml-auto" />

    <button
      type="button"
      (click)="themeService.toggle()"
      [attr.aria-label]="
        themeService.theme() === 'dark' ? i18n.t('theme.toLight') : i18n.t('theme.toDark')
      "
      class="rounded-full p-2 text-gray-600 transition-colors hover:bg-gray-100 hover:text-gray-900 dark:text-gray-300 dark:hover:bg-gray-800 dark:hover:text-white"
    >
      @if (themeService.theme() === 'dark') {
        <svg
          viewBox="0 0 24 24"
          class="size-5"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="4" />
          <path
            d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
          />
        </svg>
      } @else {
        <svg
          viewBox="0 0 24 24"
          class="size-5"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
        </svg>
      }
    </button>
  </div>
</header>

<main class="mx-auto w-full max-w-6xl flex-1 px-4 py-6">
  <router-outlet />
</main>

<footer class="border-t border-gray-200 dark:border-gray-800">
  <div class="mx-auto max-w-6xl px-4 py-6 text-sm text-gray-500">
    <!-- TMDB's terms of use require this notice in apps that use their API -->
    {{ i18n.t('footer.dataFrom') }}
    <a
      href="https://www.themoviedb.org"
      target="_blank"
      rel="noopener"
      class="font-semibold text-brand-600 hover:underline dark:text-brand-400"
      >TMDB</a
    >. {{ i18n.t('footer.disclaimer') }}
  </div>
</footer>

<app-toast />
