<div class="fixed right-4 bottom-4 z-50 flex flex-col gap-2" aria-live="polite">
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      role="alert"
      class="flex max-w-sm items-start gap-3 rounded-lg bg-red-600 px-4 py-3 text-sm text-white shadow-lg"
    >
      <span class="flex-1">{{ toast.message }}</span>
      <button
        type="button"
        (click)="toastService.dismiss(toast.id)"
        [attr.aria-label]="i18n.t('toast.close')"
        class="font-bold opacity-80 hover:opacity-100"
      >
        ✕
      </button>
    </div>
  }
</div>
