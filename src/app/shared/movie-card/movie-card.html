<a [routerLink]="link()" class="group block">
  <div class="aspect-2/3 overflow-hidden rounded-lg bg-gray-200 dark:bg-gray-800">
    @if (posterUrl(); as url) {
      <img
        [src]="url"
        [alt]="title()"
        loading="lazy"
        class="h-full w-full object-cover transition-transform group-hover:scale-105"
      />
    } @else {
      <!-- No poster: show the title on a gray box instead of a broken image -->
      <div class="flex h-full items-center justify-center p-2 text-center text-sm text-gray-500">
        {{ title() }}
      </div>
    }
  </div>

  <div class="mt-2 flex items-start justify-between gap-2">
    <div class="min-w-0">
      <h3 class="truncate text-sm font-semibold">{{ title() }}</h3>
      @if (year()) {
        <p class="text-xs text-gray-500">{{ year() }}</p>
      }
    </div>
    <app-rating-badge [rating]="item().vote_average" />
  </div>
</a>
