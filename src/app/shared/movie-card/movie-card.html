<!-- The button sits outside the link because HTML doesn't allow a button inside an <a> -->
<div class="group relative">
  <a [routerLink]="link()" class="block">
    <div
      class="aspect-2/3 overflow-hidden rounded-xl bg-gray-200 shadow-sm ring-1 ring-black/5 transition duration-300 group-hover:-translate-y-1 group-hover:shadow-xl group-hover:ring-brand-500/60 dark:bg-gray-800 dark:ring-white/10"
    >
      @if (posterUrl(); as url) {
        <img
          [src]="url"
          [alt]="title()"
          loading="lazy"
          class="h-full w-full object-cover text-transparent transition-transform duration-300 group-hover:scale-105"
        />
      } @else {
        <div class="flex h-full items-center justify-center p-2 text-center text-sm text-gray-500">
          {{ title() }}
        </div>
      }
    </div>

    <div class="mt-2 flex items-start justify-between gap-2">
      <div class="min-w-0">
        <h3
          class="truncate text-sm font-semibold transition-colors group-hover:text-brand-600 dark:group-hover:text-brand-400"
        >
          {{ title() }}
        </h3>
        @if (year()) {
          <p class="text-xs text-gray-500">{{ year() }}</p>
        }
      </div>
      <app-rating-badge [rating]="item().vote_average" />
    </div>
  </a>

  <button
    type="button"
    (click)="toggleWatchlist()"
    [attr.aria-label]="
      inWatchlist() ? 'Remove ' + title() + ' from watchlist' : 'Add ' + title() + ' to watchlist'
    "
    class="absolute top-2 right-2 rounded-full p-1.5 text-white shadow-md backdrop-blur-sm transition group-hover:-translate-y-1 hover:scale-110"
    [class]="inWatchlist() ? 'bg-brand-600' : 'bg-black/50 hover:bg-black/70'"
  >
    <svg
      viewBox="0 0 24 24"
      class="size-4"
      [attr.fill]="inWatchlist() ? 'currentColor' : 'none'"
      stroke="currentColor"
      stroke-width="2"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M6 3h12v18l-6-4-6 4z" />
    </svg>
  </button>
</div>
