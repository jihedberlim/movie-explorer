<section class="mb-10">
  <h2 class="mb-4 border-l-4 border-brand-600 pl-3 text-xl font-bold sm:text-2xl">{{ title() }}</h2>

  @if (items(); as items) {
    @if (items.length === 0) {
      <p class="py-6 text-sm text-gray-500">{{ i18n.t('carousel.empty') }}</p>
    } @else {
      <div class="flex snap-x gap-4 overflow-x-auto pt-1 pb-2">
        @for (item of items; track item.id) {
          <div class="w-36 shrink-0 snap-start sm:w-40">
            <app-movie-card [item]="item" />
          </div>
        }
      </div>
    }
  } @else {
    <div class="flex gap-4 overflow-hidden pb-2">
      @for (skeleton of skeletons; track $index) {
        <div class="w-36 shrink-0 sm:w-40">
          <app-skeleton-card />
        </div>
      }
    </div>
  }
</section>
